      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry

    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        if (typeof text === 'string') {

        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

"<!DOCTYPE html>\n<html lang=\"it\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Spicchio<\u002Ftitle>\n<meta name=\"description\" content=\"Food cost, scarti, ricette e conti della pizzeria, sempre aggiornati su telefono, tablet e PC.\">\n<meta name=\"theme-color\" content=\"#d4352a\">\n<style>x-dc{display:none!important}<\u002Fstyle>\n<script src=\"06748afd-c1ce-4df8-8d70-4e100eaa5048\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <link rel=\"icon\" type=\"image/png\" sizes=\"192x192\" href=\"bf3bf14c-348d-43f9-92c7-3988e24dd552\">\n  <link rel=\"apple-touch-icon\" sizes=\"180x180\" href=\"08e8a4c3-5117-462e-9d31-bcd41a163cf0\">\n  <link rel=\"manifest\" href=\"manifest.webmanifest\">\n  <link rel=\"preload\" href=\"/fonts/bricolage-latin-v1.woff2\" as=\"font\" type=\"font/woff2\" crossorigin>\n  <style>/* Bricolage Grotesque (SIL Open Font License), ospitato con l'app: niente Google Fonts. Font variabile: un file per tutti i pesi. */\n@font-face { font-family: 'Bricolage Grotesque'; font-style: normal; font-weight: 200 800; font-stretch: 100%; font-display: swap; src: url(\"/fonts/bricolage-latin-ext-v1.woff2\") format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }\n@font-face { font-family: 'Bricolage Grotesque'; font-style: normal; font-weight: 200 800; font-stretch: 100%; font-display: swap; src: url(\"/fonts/bricolage-latin-v1.woff2\") format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n  <script src=\"2a01ca17-7b4c-49f9-8060-f1ab139e3b44\"><\u002Fscript>\n  <style>\n    @keyframes ddtbar { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }\n    @keyframes toastbar { from { transform: scaleX(1); } to { transform: scaleX(0); } }\n    body { margin: 0; }\n    * { box-sizing: border-box; }\n    body { background: #fff6ea; }\n    a { color: #a3251b; }\n    a:hover { color: #1a1a1a; }\n    /* etichette leggibili: il design system le fa a 11 px */\n    .tag { font-size: 12.5px; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);--color-bg:#fff6ea;--color-surface:#ffffff;--color-text:#1a1a1a;--color-accent:#d4352a;--color-accent-2:#1a7a43;--color-divider:rgba(26,26,26,.18);--color-accent-100:#fde8e5;--color-accent-200:#f9cbc5;--color-accent-300:#f3a297;--color-accent-400:#ec7566;--color-accent-500:#d4352a;--color-accent-600:#c92f23;--color-accent-700:#a3251b;--color-accent-800:#7a1c15;--color-accent-900:#4f130e;--color-neutral-100:#fbf6ee;--color-neutral-200:#f1e9dc;--color-neutral-300:#e2d7c6;--color-neutral-400:#c8bba7;--color-neutral-500:#a4978a;--color-neutral-600:#7f746a;--color-neutral-700:#544c45;--color-neutral-800:#3d3732;--color-neutral-900:#24201d;--font-heading:'Bricolage Grotesque',system-ui,sans-serif;--font-body:'Bricolage Grotesque',system-ui,sans-serif;--font-heading-weight:800;--radius-sm:8px;--radius-md:14px;--radius-lg:20px;--shadow-lg:6px 6px 0 #1a1a1a;--shadow-md:4px 4px 0 #1a1a1a;--shadow-sm:2px 2px 0 #1a1a1a;padding-left:{{ shell.padL }};padding-bottom:{{ shell.padB }};padding-top:{{ shell.padT }}\">\n  <sc-if value=\"{{ privacyOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closePrivacy }}\" style=\"position:fixed;inset:0;z-index:70;background:rgba(29,31,32,.5)\"><\u002Fdiv>\n    <div role=\"dialog\" aria-label=\"Privacy\" style=\"position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 24px));max-height:calc(100vh - 48px);overflow:auto;background:#fff6ea;color:#1d1f20;border:2px solid #1d1f20;border-radius:20px;box-shadow:6px 6px 0 #1d1f20;padding:22px;display:flex;flex-direction:column;gap:14px;font-size:14.5px;line-height:1.5;text-align:left\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><div style=\"display:flex;flex-direction:column\"><span style=\"font-size:13px;color:#544c45\">Spicchio<\u002Fspan><span style=\"font-size:24px;font-weight:800;letter-spacing:-.02em\">Privacy e uso dei dati<\u002Fspan><\u002Fdiv><button sc-camel-on-click=\"{{ closePrivacy }}\" aria-label=\"Chiudi\" style=\"width:44px;height:44px;border:0;background:transparent;color:#1d1f20;cursor:pointer;display:flex;align-items:center;justify-content:center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M18 6 6 18\"><\u002Fpath><path d=\"m6 6 12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><strong style=\"font-size:16px\">Chi tratta i dati<\u002Fstrong><span>Ogni pizzeria è titolare dei dati del suo locale e di chi ci lavora. SpicchioTest, che gestisce l’app, li tratta per suo conto come responsabile del trattamento. Contatto: spicchio.informazioni@gmail.com.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><strong style=\"font-size:16px\">Quali dati<\u002Fstrong><span>Email e accessi di chi usa l’app; ricette, prezzi, fornitori, bolle e fatture, scarti (con chi li ha registrati), vendite, costi fissi e incassi della pizzeria. Non raccogliamo dati dei clienti della pizzeria. Chi chiede di partecipare alla prova lascia nome, contatti e alcune informazioni sulla pizzeria: li usiamo solo per organizzare la prova.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><strong style=\"font-size:16px\">Perché<\u002Fstrong><span>Per far funzionare l’app: calcolare costi, scarti e margini e conservare i documenti. Nessuna pubblicità e nessuna profilazione. Chi registra uno scarto viene salvato per sapere chi può eliminarlo, non per valutare il lavoro delle persone.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><strong style=\"font-size:16px\">Chi può vedere i dati<\u002Fstrong><span>Ogni pizzeria vede solo i propri dati. SpicchioTest, che gestisce l’app, può accedervi solo quando serve per assistenza, correzione di errori, sicurezza e manutenzione, e con le stesse regole vale per chi lavora per suo conto. Per migliorare l’app e offrire confronti di settore (per esempio il food cost medio delle pizzerie) usa dati aggregati e anonimi, da cui non si può risalire né alla pizzeria né alle persone. I dati non vengono venduti né ceduti a terzi, e i dati di una pizzeria non vengono mai mostrati a un’altra.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><strong style=\"font-size:16px\">Dove stanno<\u002Fstrong><span>Database e file su Supabase; l’app è pubblicata su Cloudflare. Quando usi la lettura automatica, la foto o il PDF della bolla viene inviato ad Anthropic solo per estrarne righe e prezzi. Ogni pizzeria vede solo i propri dati.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><strong style=\"font-size:16px\">Sul tuo dispositivo<\u002Fstrong><span>Restano la sessione di accesso, gli scarti e i documenti in attesa di invio e una copia dei dati per usare l’app senza rete. Con “Esci” vengono cancellati. Non usiamo cookie di profilazione.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><strong style=\"font-size:16px\">Per quanto tempo<\u002Fstrong><span>Finché la pizzeria usa il servizio. Quando il titolare toglie un dipendente, se non lavora in altre pizzerie il suo account viene eliminato.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><strong style=\"font-size:16px\">I tuoi diritti<\u002Fstrong><span>Puoi chiedere di vedere, correggere, esportare o cancellare i tuoi dati, e puoi rivolgerti al Garante per la protezione dei dati personali. Una copia dei dati della pizzeria si scarica da Impostazioni › Dati.<\u002Fspan>\n        <sc-if value=\"{{ privacyStaff }}\" hint-placeholder-val=\"{{ false }}\"><span><b>Per cancellare il tuo account<\u002Fb> chiedi al titolare della pizzeria: lo fa da Impostazioni › Persone.<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ privacyNotStaff }}\" hint-placeholder-val=\"{{ true }}\"><span><b>Per cancellare il tuo account o i dati della pizzeria<\u002Fb> scrivi a spicchio.informazioni@gmail.com.<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ authOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh;background:#d4352a;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:#1d1f20\">\n      <div style=\"background:#fff6ea;border:2px solid #1d1f20;border-radius:24px;box-shadow:8px 8px 0 #1d1f20;width:100%;max-width:420px;padding:32px 26px;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center\">\n          <span aria-hidden=\"true\" style=\"display:flex;align-items:center;justify-content:center;flex:none;width:84px;height:84px;border-radius:50%;border:2px solid #1d1f20;background:#fff6ea\"><svg width=\"58\" height=\"58\" sc-camel-view-box=\"0 0 100 100\" aria-hidden=\"true\"><path d=\"M50 90 16 28Q50 8 84 28Z\" fill=\"#ffc53d\" stroke=\"#1d1f20\" stroke-width=\"5\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M16 28Q50 8 84 28L79 37Q50 20 21 37Z\" fill=\"#e9a23b\" stroke=\"#1d1f20\" stroke-width=\"4\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"40\" cy=\"47\" r=\"7\" fill=\"#d4352a\" stroke=\"#1d1f20\" stroke-width=\"3\"><\u002Fcircle><circle cx=\"61\" cy=\"45\" r=\"6\" fill=\"#d4352a\" stroke=\"#1d1f20\" stroke-width=\"3\"><\u002Fcircle><circle cx=\"51\" cy=\"66\" r=\"5.5\" fill=\"#d4352a\" stroke=\"#1d1f20\" stroke-width=\"3\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n          <span style=\"font-size:15px;font-weight:800;letter-spacing:.02em\">Spicchio<\u002Fspan>\n          <sc-if value=\"{{ inProva }}\" hint-placeholder-val=\"{{ true }}\"><span role=\"note\" title=\"App in fase di test: non ancora rilasciata\" style=\"display:inline-flex;flex-direction:column;align-items:center;padding:5px 14px;border:2.5px dashed #a3251b;border-radius:10px;background:#fff;color:#a3251b;transform:rotate(-3deg);line-height:1.2\"><span style=\"font-size:14px;font-weight:800\">Versione di prova<\u002Fspan><span style=\"font-size:12px;font-weight:600\">app non ancora rilasciata<\u002Fspan><\u002Fspan><\u002Fsc-if>\n          <h1 style=\"margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1\">{{ auth.title }}<\u002Fh1>\n          <p style=\"margin:0;font-size:15px;line-height:1.45;color:#3d3732;text-wrap:pretty\">{{ auth.say }}<\u002Fp>\n        <\u002Fdiv>\n        <sc-if value=\"{{ auth.hasNotice }}\" hint-placeholder-val=\"{{ false }}\"><div role=\"alert\" style=\"background:#ffc53d;border:2px solid #1d1f20;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:700;text-align:center\">{{ auth.notice }}<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ auth.isLogin }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ auth.submitLogin }}\" style=\"display:flex;flex-direction:column;gap:14px\">\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700\">Email<input type=\"email\" autocomplete=\"username\" value=\"{{ auth.email }}\" sc-camel-on-change=\"{{ auth.setEmail }}\" style=\"font:inherit;font-size:16px;font-weight:400;min-height:48px;padding:0 14px;border:2px solid #1d1f20;border-radius:12px;background:#fff;color:#1d1f20\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700\">Password<input type=\"password\" autocomplete=\"current-password\" value=\"{{ auth.pass }}\" sc-camel-on-change=\"{{ auth.setPass }}\" style=\"font:inherit;font-size:16px;font-weight:400;min-height:48px;padding:0 14px;border:2px solid #1d1f20;border-radius:12px;background:#fff;color:#1d1f20\"><\u002Flabel>\n            <span role=\"alert\" style=\"font-size:14px;font-weight:700;color:#a3251b;min-height:20px;text-align:center\">{{ auth.msg }}<\u002Fspan>\n            <button type=\"submit\" disabled=\"{{ auth.busy }}\" style=\"min-height:54px;font:inherit;font-size:18px;font-weight:800;color:#1d1f20;background:#ffc53d;border:2px solid #1d1f20;border-radius:16px;box-shadow:4px 4px 0 #1d1f20;cursor:pointer\">{{ auth.loginL }}<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ auth.goForgot }}\" style=\"align-self:center;font:inherit;font-size:14px;font-weight:700;color:#1d1f20;background:transparent;border:0;text-decoration:underline;text-underline-offset:3px;min-height:44px;cursor:pointer\">Password dimenticata?<\u002Fbutton>\n          <\u002Fform>\n          <sc-if value=\"{{ auth.signupOn }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" sc-camel-on-click=\"{{ auth.goSignup }}\" style=\"min-height:50px;font:inherit;font-size:16px;font-weight:800;color:#1d1f20;background:#fff;border:2px solid #1d1f20;border-radius:14px;cursor:pointer\">Nuova pizzeria? Crea un account<\u002Fbutton><\u002Fsc-if>\n          <sc-if value=\"{{ auth.betaOn }}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" sc-camel-on-click=\"{{ auth.goBeta }}\" style=\"min-height:50px;font:inherit;font-size:16px;font-weight:800;color:#1d1f20;background:#fff;border:2px solid #1d1f20;border-radius:14px;cursor:pointer\">Hai una pizzeria? Partecipa alla prova<\u002Fbutton><\u002Fsc-if>\n          <div style=\"display:flex;align-items:center;gap:10px;font-size:13px;color:#544c45\"><span style=\"flex:1;height:1.5px;background:#d9ccb8\"><\u002Fspan>oppure<span style=\"flex:1;height:1.5px;background:#d9ccb8\"><\u002Fspan><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ auth.startDemo }}\" style=\"min-height:50px;font:inherit;font-size:16px;font-weight:700;color:#1d1f20;background:#fff;border:2px solid #1d1f20;border-radius:14px;cursor:pointer\">Prova con dati di esempio<\u002Fbutton><button type=\"button\" sc-camel-on-click=\"{{ openPrivacy }}\" style=\"align-self:center;font:inherit;font-size:13px;font-weight:600;min-height:40px;padding:0 10px;border:0;background:transparent;color:#544c45;text-decoration:underline;cursor:pointer\">Privacy e uso dei dati<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ auth.isForgot }}\" hint-placeholder-val=\"{{ false }}\">\n          <form sc-camel-on-submit=\"{{ auth.submitForgot }}\" style=\"display:flex;flex-direction:column;gap:14px\">\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700\">Email<input type=\"email\" autocomplete=\"username\" value=\"{{ auth.email }}\" sc-camel-on-change=\"{{ auth.setEmail }}\" style=\"font:inherit;font-size:16px;font-weight:400;min-height:48px;padding:0 14px;border:2px solid #1d1f20;border-radius:12px;background:#fff;color:#1d1f20\"><\u002Flabel>\n            <span role=\"alert\" style=\"font-size:14px;font-weight:700;color:{{ auth.msgColor }};min-height:20px;text-align:center;text-wrap:pretty\">{{ auth.msg }}<\u002Fspan>\n            <button type=\"submit\" disabled=\"{{ auth.busy }}\" style=\"min-height:54px;font:inherit;font-size:18px;font-weight:800;color:#1d1f20;background:#ffc53d;border:2px solid #1d1f20;border-radius:16px;box-shadow:4px 4px 0 #1d1f20;cursor:pointer\">Invia il link<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ auth.goLogin }}\" style=\"align-self:center;font:inherit;font-size:14px;font-weight:700;color:#1d1f20;background:transparent;border:0;text-decoration:underline;text-underline-offset:3px;min-height:44px;cursor:pointer\">Torna all’accesso<\u002Fbutton>\n          <\u002Fform>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ auth.isReset }}\" hint-placeholder-val=\"{{ false }}\">\n          <form sc-camel-on-submit=\"{{ auth.submitReset }}\" style=\"display:flex;flex-direction:column;gap:14px\">\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700\">Nuova password<input type=\"password\" autocomplete=\"new-password\" value=\"{{ auth.pass }}\" sc-camel-on-change=\"{{ auth.setPass }}\" style=\"font:inherit;font-size:16px;font-weight:400;min-height:48px;padding:0 14px;border:2px solid #1d1f20;border-radius:12px;background:#fff;color:#1d1f20\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700\">Ripeti la password<input type=\"password\" autocomplete=\"new-password\" value=\"{{ auth.pass2 }}\" sc-camel-on-change=\"{{ auth.setPass2 }}\" style=\"font:inherit;font-size:16px;font-weight:400;min-height:48px;padding:0 14px;border:2px solid #1d1f20;border-radius:12px;background:#fff;color:#1d1f20\"><\u002Flabel>\n            <span role=\"alert\" style=\"font-size:14px;font-weight:700;color:#a3251b;min-height:20px;text-align:center\">{{ auth.msg }}<\u002Fspan>\n            <button type=\"submit\" disabled=\"{{ auth.busy }}\" style=\"min-height:54px;font:inherit;font-size:18px;font-weight:800;color:#1d1f20;background:#ffc53d;border:2px solid #1d1f20;border-radius:16px;box-shadow:4px 4px 0 #1d1f20;cursor:pointer\">Salva e entra<\u002Fbutton>\n          <\u002Fform>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ auth.isSignup }}\" hint-placeholder-val=\"{{ false }}\">\n          <form sc-camel-on-submit=\"{{ auth.submitSignup }}\" style=\"display:flex;flex-direction:column;gap:14px\">\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700\">Nome della pizzeria<input type=\"text\" autocomplete=\"organization\" maxlength=\"80\" value=\"{{ auth.nome }}\" sc-camel-on-change=\"{{ auth.setNome }}\" style=\"font:inherit;font-size:16px;font-weight:400;min-height:48px;padding:0 14px;border:2px solid #1d1f20;border-radius:12px;background:#fff;color:#1d1f20\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700\">Email del titolare<input type=\"email\" autocomplete=\"username\" value=\"{{ auth.email }}\" sc-camel-on-change=\"{{ auth.setEmail }}\" style=\"font:inherit;font-size:16px;font-weight:400;min-height:48px;padding:0 14px;border:2px solid #1d1f20;border-radius:12px;background:#fff;color:#1d1f20\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700\">Password<input type=\"password\" autocomplete=\"new-password\" value=\"{{ auth.pass }}\" sc-camel-on-change=\"{{ auth.setPass }}\" style=\"font:inherit;font-size:16px;font-weight:400;min-height:48px;padding:0 14px;border:2px solid #1d1f20;border-radius:12px;background:#fff;color:#1d1f20\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700\">Ripeti la password<input type=\"password\" autocomplete=\"new-password\" value=\"{{ auth.pass2 }}\" sc-camel-on-change=\"{{ auth.setPass2 }}\" style=\"font:inherit;font-size:16px;font-weight:400;min-height:48px;padding:0 14px;border:2px solid #1d1f20;border-radius:12px;background:#fff;color:#1d1f20\"><\u002Flabel>\n            <label style=\"display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.4;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ auth.priv }}\" sc-camel-on-change=\"{{ auth.setPriv }}\" style=\"flex:none;width:20px;height:20px;margin-top:1px;accent-color:#1d1f20\"><span>Ho letto l’informativa privacy e accetto che i dati della pizzeria siano trattati come descritto.<\u002Fspan><\u002Flabel>\n            <button type=\"button\" sc-camel-on-click=\"{{ openPrivacy }}\" style=\"align-self:flex-start;font:inherit;font-size:13px;font-weight:600;min-height:36px;padding:0;border:0;background:transparent;color:#544c45;text-decoration:underline;cursor:pointer\">Leggi l’informativa privacy<\u002Fbutton>\n            <span role=\"alert\" style=\"font-size:14px;font-weight:700;color:#a3251b;min-height:20px;text-align:center;text-wrap:pretty\">{{ auth.msg }}<\u002Fspan>\n            <button type=\"submit\" disabled=\"{{ auth.busy }}\" style=\"min-height:54px;font:inherit;font-size:18px;font-weight:800;color:#1d1f20;background:#ffc53d;border:2px solid #1d1f20;border-radius:16px;box-shadow:4px 4px 0 #1d1f20;cursor:pointer\">{{ auth.signupL }}<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ auth.goLogin }}\" style=\"align-self:center;font:inherit;font-size:14px;font-weight:700;color:#1d1f20;background:transparent;border:0;text-decoration:underline;text-underline-offset:3px;min-height:44px;cursor:pointer\">Hai già un account? Accedi<\u002Fbutton>\n          <\u002Fform>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ auth.isBeta }}\" hint-placeholder-val=\"{{ false }}\">\n          <form sc-camel-on-submit=\"{{ auth.submitBeta }}\" style=\"display:flex;flex-direction:column;gap:14px;text-align:left\" novalidate=\"{{ true }}\">\n            <h2 style=\"margin:6px 0 0;font-size:18px;font-weight:800;letter-spacing:-.01em;border-top:1.5px solid #d9ccb8;padding-top:14px\">Chi sei<\u002Fh2>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700\">Nome e cognome *<input type=\"text\" autocomplete=\"name\" maxlength=\"80\" value=\"{{ auth.c.nome }}\" sc-camel-on-change=\"{{ auth.cSet.nome }}\" style=\"font:inherit;font-size:16px;font-weight:400;min-height:48px;padding:0 14px;border:2px solid #1d1f20;border-radius:12px;background:#fff;color:#1d1f20\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700\">Ruolo nella pizzeria<sc-raw-select value=\"{{ auth.c.ruolo }}\" sc-camel-on-change=\"{{ auth.cSet.ruolo }}\"
